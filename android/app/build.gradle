// Built by scripts/build-android.sh, which fetches SDL2 and builds
// SwanStation (packed as jniLibs), and passes SDL2's path as a Gradle property:
//   -PsdlDir=...
// Release signing (optional; debug-signed otherwise) from the environment:
//   PSXDS_KEYSTORE, PSXDS_KEYSTORE_PASSWORD, PSXDS_KEY_ALIAS, PSXDS_KEY_PASSWORD
plugins {
    id "com.android.application"
}

def need = { String name ->
    if (!project.hasProperty(name)) throw new GradleException("-P${name}=... missing (build with scripts/build-android.sh)")
    return file(project.property(name)).absolutePath
}
def sdlDir = need("sdlDir")
def cpuFlags = project.hasProperty("cpuFlags") ? project.property("cpuFlags") : ""
def appVersion = rootProject.file("../VERSION").text.trim()
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int
def keystore = System.getenv("PSXDS_KEYSTORE")

android {
    namespace "io.github.gin649.psxds"
    compileSdk 34
    packaging {
        jniLibs {
            // the two SwanStation copies are unpacked to nativeLibraryDir and
            // loaded by path, one each for the game and the hidden copy
            useLegacyPackaging true
            keepDebugSymbols += ['**/libswan_a.so', '**/libswan_b.so']
        }
    }
    def ndkDir = System.getenv("ANDROID_NDK_HOME") ?: System.getenv("ANDROID_NDK_LATEST_HOME")
    if (ndkDir) {
        ndkPath ndkDir
        // AGP insists ndkVersion matches the NDK at ndkPath
        def props = new Properties()
        new File(ndkDir, "source.properties").withInputStream { props.load(it) }
        ndkVersion props.getProperty("Pkg.Revision")
    }

    defaultConfig {
        applicationId "io.github.gin649.psxds"
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName appVersion
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                        "-DPSXDS_SDL_SRC=${sdlDir}",
                        "-DPSXDS_VERSION=${appVersion}"
            }
        }
    }

    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storePassword System.getenv("PSXDS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PSXDS_KEY_ALIAS")
                keyPassword System.getenv("PSXDS_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                    cFlags "-O2", *(cpuFlags ? [cpuFlags] : [])
                }
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            // SDL's Java side (SDLActivity...) straight from the SDL source, so it always matches libSDL2.so
            java.srcDirs += "${sdlDir}/android-project/app/src/main/java"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
